# Build the Linux and Windows program files, and publish them as a GitHub release.
#
# Runs when a version tag is pushed:
#
#     git tag -a v1.04 -m "LakeMark 1.04"
#     git push origin v1.02
#
# The tests run on both systems first; if they fail, nothing is published. The release (named
# after the tag) gets three files: lakemark-<version>-linux, lakemark-<version>-windows.exe, and
# lakemark-<version>-stick.zip, both programs ready to unzip onto a USB stick (make_stick_zip.sh).
#
# It can also be started by hand (Actions > Build and release > Run workflow) to check that the
# builds work: then the files are kept with the run (under Artifacts) and nothing is published.

name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # An older Ubuntu, so the Linux file runs on older Linux systems as well as newer ones.
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          ./build_linux.sh
          dist/lakemark --version
          mv dist/lakemark "dist/lakemark-${GITHUB_REF_NAME#v}-linux"

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: cmd
        env:
          PYTHON: python
        run: |
          call build_windows.bat || exit /b 1
          set VERSION=%GITHUB_REF_NAME:v=%
          move dist\lakemark.exe "dist\lakemark-%VERSION%-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 2   # passed to the release job, or a trial build to download; not kept for months
          name: lakemark-${{ matrix.name }}
          path: dist/lakemark-*
          if-no-files-found: error

  stick:
    # The stick zip, from the two programs: no club data, so it starts with the sample club.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Make the stick zip
        run: |
          version="$(ls files/lakemark-*-linux | sed 's|.*/lakemark-\(.*\)-linux|\1|')"
          ./make_stick_zip.sh files "$version"

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 2
          name: lakemark-stick
          path: files/lakemark-*-stick.zip
          if-no-files-found: error

  release:
    # Only for a version tag, not when started by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, stick]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LakeMark ${GITHUB_REF_NAME#v}" \
            --notes-file - <<'EOF'
          Download the file for your computer: **-linux** for Linux, **-windows.exe** for Windows. Your competitions and club sailors stay in Documents/LakeMark and are not touched by a new version.

          **-stick.zip** makes a LakeMark USB stick that works on both: use a stick of at least 100 MB, format it exFAT, then unzip the file onto it, straight into the top of the stick (on Windows, Extract All and choose the stick's drive, such as E:\). It holds no club data: the first start makes a sample club, LMBC, to try the program on. On Windows, install-windows.bat on the stick installs LakeMark in Documents\LakeMark.
          EOF
